services:
  etcd_01:
    build: ./etcd
    container_name: etcd_01
    hostname: etcd_01
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    volumes:
      - etcd_01_data:/var/etcd-data
    environment:
      CA_ROOT_CERT_FILE: /run/secrets/ca_root_cert
      CA_ROOT_KEY_FILE: /run/secrets/ca_root_key
      ETCD_INITIAL_CLUSTER: etcd_01=https://etcd_01:2380,etcd_02=https://etcd_02:2380,etcd_03=https://etcd_03:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN_FILE: /run/secrets/etcd_initial_cluster_token
    secrets:
      - ca_root_cert
      - ca_root_key
      - etcd_initial_cluster_token
    networks:
      cluster:

  etcd_02:
    build: ./etcd
    container_name: etcd_02
    hostname: etcd_02
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    volumes:
      - etcd_02_data:/var/etcd-data
    environment:
      CA_ROOT_CERT_FILE: /run/secrets/ca_root_cert
      CA_ROOT_KEY_FILE: /run/secrets/ca_root_key
      ETCD_INITIAL_CLUSTER: etcd_01=https://etcd_01:2380,etcd_02=https://etcd_02:2380,etcd_03=https://etcd_03:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN_FILE: /run/secrets/etcd_initial_cluster_token
    secrets:
      - ca_root_cert
      - ca_root_key
      - etcd_initial_cluster_token
    networks:
      cluster:

  etcd_03:
    build: ./etcd
    container_name: etcd_03
    hostname: etcd_03
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    volumes:
      - etcd_03_data:/var/etcd-data
    environment:
      CA_ROOT_CERT_FILE: /run/secrets/ca_root_cert
      CA_ROOT_KEY_FILE: /run/secrets/ca_root_key
      ETCD_INITIAL_CLUSTER: etcd_01=https://etcd_01:2380,etcd_02=https://etcd_02:2380,etcd_03=https://etcd_03:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN_FILE: /run/secrets/etcd_initial_cluster_token
    secrets:
      - ca_root_cert
      - ca_root_key
      - etcd_initial_cluster_token
    networks:
      cluster:

  pg_01:
    build: ./patroni
    container_name: pg_01
    hostname: pg_01
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    volumes:
      - pg_01_data:/var/lib/postgresql
    environment:
      CA_ROOT_CERT_FILE: /run/secrets/ca_root_cert
      CA_ROOT_KEY_FILE: /run/secrets/ca_root_key
      ETCD_HOSTS: etcd_01:2379,etcd_02:2379,etcd_03:2379
      CLUSTER:
      POSTGRES_SU_USER: postgres
      POSTGRES_SU_PWD_FILE: /run/secrets/postgres_su_password
      POSTGRES_REPL_USER: replicator
      POSTGRES_REPL_PWD_FILE: /run/secrets/postgres_repl_password
      POSTGRES_REWIND_USER: rewinder
      POSTGRES_REWIND_PWD_FILE: /run/secrets/postgres_rewind_password
      POSTGRES_SUBNET: "0.0.0.0/0"
      PGBOUNCER_PWD_FILE: /run/secrets/pgbouncer_password
      BACKUP_NAME:
      BACKUP_REGION_FILE: /run/secrets/backup_region
      BACKUP_PATH_FILE: /run/secrets/backup_path
      BACKUP_ACCESS_KEY_FILE: /run/secrets/backup_access_key
      BACKUP_SECRET_KEY_FILE: /run/secrets/backup_secret_key
      RESTORE_NAME:
      RESTORE_REGION_FILE: /run/secrets/restore_region
      RESTORE_PATH_FILE: /run/secrets/restore_path
      RESTORE_ACCESS_KEY_FILE: /run/secrets/restore_access_key
      RESTORE_SECRET_KEY_FILE: /run/secrets/restore_secret_key
    secrets:
      - ca_root_cert
      - ca_root_key
      - postgres_su_password
      - postgres_repl_password
      - postgres_rewind_password
      - pgbouncer_password
      - backup_path
      - backup_region
      - backup_access_key
      - backup_secret_key
      - restore_path
      - restore_region
      - restore_access_key
      - restore_secret_key
    networks:
      cluster:

  pg_02:
    build: ./patroni
    container_name: pg_02
    hostname: pg_02
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    volumes:
      - pg_02_data:/var/lib/postgresql
    environment:
      CA_ROOT_CERT_FILE: /run/secrets/ca_root_cert
      CA_ROOT_KEY_FILE: /run/secrets/ca_root_key
      ETCD_HOSTS: etcd_01:2379,etcd_02:2379,etcd_03:2379
      CLUSTER:
      POSTGRES_SU_USER: postgres
      POSTGRES_SU_PWD_FILE: /run/secrets/postgres_su_password
      POSTGRES_REPL_USER: replicator
      POSTGRES_REPL_PWD_FILE: /run/secrets/postgres_repl_password
      POSTGRES_REWIND_USER: rewinder
      POSTGRES_REWIND_PWD_FILE: /run/secrets/postgres_rewind_password
      POSTGRES_SUBNET: "0.0.0.0/0"
      PGBOUNCER_PWD_FILE: /run/secrets/pgbouncer_password
      BACKUP_NAME:
      BACKUP_REGION_FILE: /run/secrets/backup_region
      BACKUP_PATH_FILE: /run/secrets/backup_path
      BACKUP_ACCESS_KEY_FILE: /run/secrets/backup_access_key
      BACKUP_SECRET_KEY_FILE: /run/secrets/backup_secret_key
      RESTORE_NAME:
      RESTORE_REGION_FILE: /run/secrets/restore_region
      RESTORE_PATH_FILE: /run/secrets/restore_path
      RESTORE_ACCESS_KEY_FILE: /run/secrets/restore_access_key
      RESTORE_SECRET_KEY_FILE: /run/secrets/restore_secret_key
    secrets:
      - ca_root_cert
      - ca_root_key
      - postgres_su_password
      - postgres_repl_password
      - postgres_rewind_password
      - pgbouncer_password
      - backup_path
      - backup_region
      - backup_access_key
      - backup_secret_key
      - restore_path
      - restore_region
      - restore_access_key
      - restore_secret_key
    networks:
      cluster:

  haproxy_01:
    build: ./haproxy
    container_name: haproxy_01
    hostname: haproxy_01
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    environment:
      CA_ROOT_CERT_FILE: /run/secrets/ca_root_cert
      CA_ROOT_KEY_FILE: /run/secrets/ca_root_key
      TARGETS: pg_01:6432,pg_02:6432
    secrets:
      - ca_root_cert
      - ca_root_key
    depends_on:
      - pg_01
      - pg_02
    networks:
      cluster:
    ports:
      - 6000:5000
      - 6001:5001
      - 7001:7000

secrets:
  ca_root_cert:
    file: ./secrets/ca_root_cert
  ca_root_key:
    file: ./secrets/ca_root_key
  etcd_initial_cluster_token:
    file: ./secrets/etcd_initial_cluster_token
  postgres_su_password:
    file: ./secrets/postgres_su_password
  postgres_repl_password:
    file: ./secrets/postgres_repl_password
  postgres_rewind_password:
    file: ./secrets/postgres_rewind_password
  pgbouncer_password:
    file: ./secrets/pgbouncer_password
  backup_path:
    file: ./secrets/backup_path
  backup_region:
    file: ./secrets/backup_region
  backup_access_key:
    file: ./secrets/backup_access_key
  backup_secret_key:
    file: ./secrets/backup_secret_key
  restore_path:
    file: ./secrets/restore_path
  restore_region:
    file: ./secrets/restore_region
  restore_access_key:
    file: ./secrets/restore_access_key
  restore_secret_key:
    file: ./secrets/restore_secret_key

volumes:
  etcd_01_data:
  etcd_02_data:
  etcd_03_data:
  pg_01_data:
  pg_02_data:

networks:
  cluster:
    driver: bridge
