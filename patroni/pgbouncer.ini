[databases]
* = host=127.0.0.1 port=5432 auth_user=pgbouncer_auth_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pidfile=/var/run/pgbouncer/.pidfile
auth_file=/usr/local/etc/userlist.txt

user = pgbouncer

# Pooling mode: transaction is typical for app servers
pool_mode = transaction

# Pool sizing (tune for workload and server resources)
max_client_conn = 500
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5

# Server connection behavior
server_reset_query = DISCARD ALL
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 0
client_idle_timeout = 0

auth_type = scram-sha-256
auth_dbname = postgres
auth_query = SELECT username, password FROM pgbouncer.lookup($1)

# Administration / stats accounts
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

ignore_startup_parameters = extra_float_digits,options

dns_max_ttl = 15

# Optional TLS to clients (uncomment and provide cert files if needed)
# client_tls_sslmode = require
# client_tls_key_file = /etc/pgbouncer/client.key
# client_tls_cert_file = /etc/pgbouncer/client.crt
# client_tls_ca_file = /etc/pgbouncer/ca.crt

# Optional TLS to PostgreSQL server
# server_tls_sslmode = verify-full
# server_tls_ca_file = /etc/pgbouncer/server-ca.pem

# End of file

# -----------------------------------------------------------------------------
# Supporting SQL (run once on the PostgreSQL server as superuser):
# -----------------------------------------------------------------------------
# CREATE SCHEMA IF NOT EXISTS pgbouncer;
# CREATE OR REPLACE FUNCTION pgbouncer.lookup(p_username text)
# RETURNS TABLE(username text, password text)
# LANGUAGE sql
# SECURITY DEFINER
# SET search_path = pg_catalog, pg_temp AS
# $$
#   SELECT rolname::text AS username,
#          rolpassword::text AS password
#   FROM pg_authid
#   WHERE rolname = p_username;
# $$;
# REVOKE ALL ON FUNCTION pgbouncer.lookup(text) FROM PUBLIC;
# GRANT EXECUTE ON FUNCTION pgbouncer.lookup(text) TO pgbouncer_auth_user;
#
# CREATE ROLE pgbouncer_auth_user LOGIN PASSWORD 'REPLACE_WITH_STRONG_PASSWORD';
# CREATE ROLE pgbouncer_admin LOGIN PASSWORD 'REPLACE_WITH_ADMIN_PASSWORD';
# CREATE ROLE pgbouncer_stats LOGIN PASSWORD 'REPLACE_WITH_STATS_PASSWORD';
#
# Ensure: ALTER SYSTEM SET password_encryption = 'scram-sha-256'; then restart and create users for SCRAM.
