[databases]
* = host=/var/run/postgresql port=5432
${PGBOUNCER_DATABASES}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir=/var/run/pgbouncer

pidfile=/var/run/pgbouncer/.pidfile

syslog = 0
syslog_facility = daemon
syslog_ident = pgbouncer
; logfile=/dev/stdout

user = pgbouncer

# Pooling mode: transaction is typical for app servers
pool_mode = transaction

# Pool sizing (tune for workload and server resources)
# default_pool_size is per database
max_client_conn = 500
default_pool_size = 20 
min_pool_size = 0
reserve_pool_size = 10
reserve_pool_timeout = 2 

# Server connection behavior
# server_idle_timeout should be low to recycle connections after activity bursts
server_reset_query = DISCARD ALL
server_lifetime = 3600
server_idle_timeout = 30
query_timeout = 0
client_idle_timeout = 0

auth_type = scram-sha-256
auth_dbname = postgres
auth_query = SELECT username, password FROM pgbouncer.lookup($1)
auth_user = pgbouncer

# Administration / stats accounts
admin_users = pgbouncer
stats_users = pgbouncer

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1 
stats_period = 60

ignore_startup_parameters = extra_float_digits,options

dns_max_ttl = 15

# TLS to clients
client_tls_sslmode = require
client_tls_key_file = /usr/local/etc/ssl/server.key
client_tls_cert_file = /usr/local/etc/ssl/server.crt
client_tls_ca_file = /usr/local/etc/ssl/ca-root.crt

# TLS to postgres - not required as unix socket is used instead of tcp 
; server_tls_sslmode = verify-full
; server_tls_ca_file = /usr/local/etc/ssl/ca-root.crt
